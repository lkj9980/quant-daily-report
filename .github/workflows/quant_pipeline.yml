name: Daily  Quant Pipeline

on:
  repository_dispatch:
    types: [run_quant_pipeline]  # 외부에서 이 이름을 부르면 실행됩니다.
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Pipeline & Generate Report
        run: |
          python main.py

      - name: Commit and Push Latest Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest_report.html
          git commit -m "Auto-update daily quant report [skip ci]" || echo "No changes to commit"
          git push
