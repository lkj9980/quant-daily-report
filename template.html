<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 퀀트 백테스트 리포트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 헤더 -->
        <header class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">📈 AI 퀀트 전략 백테스트 리포트</h1>
                <p class="text-sm text-gray-400 mt-1">최종 갱신일: <span id="updateTime">{timestamp}</span></p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/30">Live Tracking</span>
        </header>

        <!-- 메인 콘텐츠 영역 (마크다운 변환 결과가 주입되는 곳) -->
        <main class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="content-body prose prose-invert max-w-none">
                {content}
            </div>
        </main>

        <!-- 푸터 -->
        <footer class="text-center text-xs text-gray-500 py-4">
            Powered by GitHub Actions & Gemini Quant Pipeline. All rights reserved.
        </footer>
    </div>
</body>
</html>
