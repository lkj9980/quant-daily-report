name: Daily  Quant Pipeline

on:
  repository_dispatch:
    types: [run_quant_pipeline]  # 외부에서 이 이름을 부르면 실행됩니다.
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Pipeline & Generate Report
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DEEP_RESEARCH_API_KEY: ${{ secrets.GEMINI_DEEP_RESEARCH_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
          MY_EMAIL: ${{ secrets.MY_EMAIL }} 
        run: |
          python main.py

      - name: Commit and Push Latest Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 원격 저장소 최신 변경 사항 안전 병합
          git pull origin main --no-rebase || echo "Pull skipped or conflicted"
          
          # 대시보드 및 결과물 디렉토리 스테이징 (루트의 index.html 포함)
          mkdir -p history data html
          git add index.html history/ data/ html/
          
          # 변경 사항이 있을 때만 커밋 및 푸시
          git diff --staged --quiet || git commit -m "Auto-update daily quant report [skip ci]"
          git push origin main
